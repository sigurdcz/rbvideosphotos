<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171510">
  <title>{site_name}</title>
</head>
<body class="etherna-page">
  <a class="skip-link" href="#etherna-content">Přeskočit na obsah</a>
  <div class="etherna-shell">
    <header class="site-header" data-etherna-header>
      <div class="header-inner">
        <a href="/" class="brand" aria-label="{site_name} — úvod"><span class="brand-mark" aria-hidden="true">E</span><span class="brand-text">{site_name}</span></a>
        <div class="etherna-nav" data-etherna-nav>{nav}</div>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-label="Otevřít menu" data-etherna-menu><span></span><span></span><span></span></button>
      </div>
    </header>
    <main id="etherna-content" class="etherna-main">{page_content}</main>
    <footer class="site-footer">
      <div class="footer-grid shell">
        <div><a href="/" class="brand brand-footer"><span class="brand-mark" aria-hidden="true">E</span><span class="brand-text">{site_name}</span></a><p class="etherna-footer-note">Autentické příběhy, fotografie a film.</p></div>
        <div class="etherna-footer-contact" data-etherna-footer-contact></div>
        <div class="etherna-footer-links" data-etherna-footer-links></div>
        <div class="etherna-footer-socials" data-etherna-footer-socials></div>
      </div>
      <div class="footer-bottom shell"><span>© {site_name}</span><span data-etherna-footer-location></span></div>
    </footer>
  </div>
</body>
</html>
