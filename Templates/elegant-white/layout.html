<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{site_name}</title>
  <meta name="theme-color" content="#fffaf3">
</head>
<body>
  <div class="theme-shell theme-elegant-white">
    <header class="theme-header">
      <div class="container theme-header__inner">
        <a href="/" class="theme-brand">{site_name}</a>
        <div class="theme-nav-wrap">{nav}</div>
      </div>
    </header>
    <main class="theme-main">
      {page_content}
    </main>
    <footer class="theme-footer">
      <div class="container theme-footer__inner">
        <div class="theme-footer__brand">{site_name}</div>
        <div class="theme-footer__meta">Elegant White &bull; {site_name}</div>
      </div>
    </footer>
  </div>
</body>
</html>
