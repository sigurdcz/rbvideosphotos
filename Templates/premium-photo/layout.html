<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0b0e">
  <title>{site_name}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500&family=Jost:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="/">{site_name}<small>foto · video · příběhy</small></a>
      <nav class="site-nav" aria-label="Hlavní navigace">{nav}</nav>
      <button class="nav-toggle" type="button" aria-label="Otevřít menu" aria-expanded="false"><span></span></button>
    </div>
  </header>
  <main>{page_content}</main>
  <footer class="site-footer" role="contentinfo"></footer>
</body>
</html>
