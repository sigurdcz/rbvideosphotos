<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{site_name}</title>
  <meta name="theme-color" content="#ffffff">
</head>
<body>
  <div class="theme-shell theme-modern-atelier">
    <header class="theme-header">
      <div class="container theme-header__inner">
        <a href="/" class="theme-brand">{site_name}</a>
        {nav}
      </div>
    </header>
    <main class="theme-main">
      {page_content}
    </main>
    <footer class="theme-footer">
      <div class="container theme-footer__inner">
        <div class="theme-footer__brand">{site_name}</div>
        <div class="theme-footer__meta">Modern Atelier • {site_name}</div>
      </div>
    </footer>
  </div>
</body>
</html>
