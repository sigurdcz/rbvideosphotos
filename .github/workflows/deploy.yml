name: Deploy to Webzdarma (production)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer dependencies (no-dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build deploy artifact
        run: |
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.claude/' \
            --exclude='_deploy/' \
            --exclude='*.bat' \
            --exclude='storage/database.sqlite' \
            --exclude='storage/database.sqlite-shm' \
            --exclude='storage/database.sqlite-wal' \
            --exclude='storage/media/' \
            --exclude='storage/cache/' \
            --exclude='storage/logs/' \
            ./ _deploy/
          mkdir -p _deploy/storage/cache
          mkdir -p _deploy/storage/logs
          mkdir -p _deploy/storage/media
          mkdir -p _deploy/storage/published
          mkdir -p _deploy/storage/templates

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftp
          local-dir: ./_deploy/
          server-dir: /web/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/_deploy/**
