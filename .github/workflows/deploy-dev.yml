name: Deploy to Webzdarma (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer dependencies (no-dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build deploy artifact
        run: |
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.claude/' \
            --exclude='_deploy/' \
            --exclude='*.bat' \
            --exclude='storage/database.sqlite' \
            --exclude='storage/database.sqlite-shm' \
            --exclude='storage/database.sqlite-wal' \
            --exclude='storage/media/' \
            --exclude='storage/cache/' \
            --exclude='storage/logs/' \
            --exclude='vendor/bin/' \
            ./ _deploy/
          mkdir -p _deploy/storage/cache
          mkdir -p _deploy/storage/logs
          mkdir -p _deploy/storage/media
          mkdir -p _deploy/storage/published
          mkdir -p _deploy/storage/templates

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lftp

      - name: Deploy via FTPS with retry (dev)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp <<EOF
          set cmd:fail-exit true
          set net:max-retries 5
          set net:reconnect-interval-base 5
          set net:reconnect-interval-multiplier 2
          set net:timeout 45
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          open -u "$FTP_USER","$FTP_PASS" "ftp://$FTP_HOST:21"
          mirror -R --verbose=1 --parallel=1 --continue --exclude-glob .env --exclude-glob ".env.*" ./_deploy/ /web/dev/
          bye
          EOF
