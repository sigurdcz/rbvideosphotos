name: Deploy to Webzdarma (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer dependencies (no-dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build deploy artifact
        run: |
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.claude/' \
            --exclude='_deploy/' \
            --exclude='*.bat' \
            --exclude='storage/database.sqlite' \
            --exclude='storage/database.sqlite-shm' \
            --exclude='storage/database.sqlite-wal' \
            --exclude='storage/cache/' \
            --exclude='storage/logs/' \
            --exclude='storage/media/' \
            --exclude='storage/published/' \
            --exclude='storage/active-theme-key.txt' \
            --exclude='public/assets/generated/' \
            --exclude='vendor/bin/' \
            ./ _deploy/
          mkdir -p _deploy/storage/cache
          mkdir -p _deploy/storage/logs
          mkdir -p _deploy/storage/media
          mkdir -p _deploy/storage/published
          mkdir -p _deploy/storage/templates

      - name: Deploy via FTPS (dev)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftps
          security: loose
          timeout: 120000
          local-dir: ./_deploy/
          server-dir: /web/dev/
          state-name: .ftp-deploy-sync-state-dev.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/_deploy/**
            **/.env
            **/.env.*
            **/storage/cache/**
            **/storage/logs/**
            **/storage/media/**
            **/storage/published/**
            **/storage/active-theme-key.txt
            **/public/assets/generated/**
