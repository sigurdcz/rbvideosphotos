name: Deploy to Active24 (staging)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    environment:
      name: staging
      url: https://staging.rbvideosphotos.cz
    runs-on: ubuntu-latest

    steps:
      - name: Check required staging secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing environment staging secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer dependencies (no-dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build deploy artifact
        run: |
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.agents/' \
            --exclude='.codex/' \
            --exclude='.codex-qa/' \
            --exclude='.tmp*' \
            --exclude='.htaccess.backup' \
            --exclude='tests/' \
            --exclude='.claude/' \
            --exclude='_deploy/' \
            --exclude='*.bat' \
            --exclude='storage/database.sqlite' \
            --exclude='storage/database.sqlite-shm' \
            --exclude='storage/database.sqlite-wal' \
            --exclude='storage/cache/' \
            --exclude='storage/logs/' \
            --exclude='storage/media/' \
            --exclude='storage/published/' \
            --exclude='storage/active-theme-key.txt' \
            --exclude='public/assets/generated/' \
            --exclude='vendor/bin/' \
            ./ _deploy/
          mkdir -p _deploy/storage/cache
          mkdir -p _deploy/storage/logs
          mkdir -p _deploy/storage/media
          mkdir -p _deploy/storage/published
          mkdir -p _deploy/storage/templates

      - name: Deploy via FTPS (staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          timeout: 120000
          local-dir: ./_deploy/
          server-dir: /
          state-name: .ftp-deploy-sync-state-dev.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/_deploy/**
            **/.env
            **/.env.*
            **/storage/cache/**
            **/storage/logs/**
            **/storage/media/**
            **/storage/published/**
            **/storage/active-theme-key.txt
            **/public/assets/generated/**
